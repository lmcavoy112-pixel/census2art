<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100">
  <!-- OUTER END - fixed size, marks the far tip away from the icon.
       x=0 is the seam with the stretch zone; x=80 is the trailing tip.
       Lighter and simpler than the inner end.
       Render at an 80:100 ratio (do not stretch this piece). -->
  <defs>
    <g id="leaf">
      <path d="M0,0 C7,-7 6.5,-18 0,-26 C-6.5,-18 -7,-7 0,0 Z"
            fill="none" stroke="var(--divider-ink, #111111)" stroke-width="2.3"
            stroke-linejoin="round"/>
      <path d="M0,-5 L0,-20"
            fill="none" stroke="var(--divider-ink, #111111)" stroke-width="1.5"
            stroke-linecap="round"/>
    </g>
  </defs>

  <!-- stem from the seam, stopping where the terminal begins -->
  <path d="M0,50 L55,50" fill="none" stroke="var(--divider-ink, #111111)"
        stroke-width="2.6"/>

  <!-- diamond closing the stretchable run -->
  <path d="M12,42.5 L19.5,50 L12,57.5 L4.5,50 Z"
        fill="none" stroke="var(--divider-ink, #111111)" stroke-width="2.4"
        stroke-linejoin="round"/>

  <!-- single leaf pair, leaning outward toward the tip -->
  <use href="#leaf" transform="translate(34,50) rotate(35) translate(0,3) scale(0.8)"/>
  <use href="#leaf" transform="translate(34,50) rotate(145) translate(0,3) scale(0.8)"/>

  <!-- pointed lozenge terminal -->
  <path d="M54,50 C60,43.5 70,43.5 76,50 C70,56.5 60,56.5 54,50 Z"
        fill="none" stroke="var(--divider-ink, #111111)" stroke-width="2.2"
        stroke-linejoin="round"/>
</svg>
