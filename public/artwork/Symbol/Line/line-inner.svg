<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100">
  <!-- INNER END - fixed size, sits nearest the icon.
       x=0 is the edge that touches the icon; x=120 is the seam with the stretch zone.
       Render at a 120:100 ratio (do not stretch this piece). -->
  <defs>
    <g id="leaf">
      <path d="M0,0 C7,-7 6.5,-18 0,-26 C-6.5,-18 -7,-7 0,0 Z"
            fill="none" stroke="var(--divider-ink, #111111)" stroke-width="2.1"
            stroke-linejoin="round"/>
      <path d="M0,-5 L0,-20"
            fill="none" stroke="var(--divider-ink, #111111)" stroke-width="1.4"
            stroke-linecap="round"/>
    </g>
  </defs>

  <!-- pointed lozenge terminal at the icon end -->
  <path d="M2,50 C8,43.5 18,43.5 24,50 C18,56.5 8,56.5 2,50 Z"
        fill="none" stroke="var(--divider-ink, #111111)" stroke-width="2.2"
        stroke-linejoin="round"/>

  <!-- main stem, runs to the seam at x=120 -->
  <path d="M24,50 L120,50" fill="none" stroke="var(--divider-ink, #111111)"
        stroke-width="2.6"/>

  <!-- smaller leaf pair -->
  <use href="#leaf" transform="translate(38,50) rotate(-35) translate(0,3) scale(0.8)"/>
  <use href="#leaf" transform="translate(38,50) rotate(215) translate(0,3) scale(0.8)"/>

  <!-- accent dots -->
  <circle cx="53" cy="42" r="2" fill="var(--divider-ink, #111111)"/>
  <circle cx="53" cy="58" r="2" fill="var(--divider-ink, #111111)"/>

  <!-- larger leaf pair -->
  <use href="#leaf" transform="translate(75,50) rotate(-35) translate(0,3)"/>
  <use href="#leaf" transform="translate(75,50) rotate(215) translate(0,3)"/>

  <!-- diamond marking the start of the stretchable run -->
  <path d="M100,42.5 L107.5,50 L100,57.5 L92.5,50 Z"
        fill="none" stroke="var(--divider-ink, #111111)" stroke-width="2.4"
        stroke-linejoin="round"/>
</svg>
