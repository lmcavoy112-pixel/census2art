<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520">
  <rect width="400" height="520" fill="#f2ece0"/>

  <!-- Outer frame -->
  <rect x="14" y="14" width="372" height="492" fill="none" stroke="#1e2b18" stroke-width="2.5"/>
  <!-- Inner frame -->
  <rect x="24" y="24" width="352" height="472" fill="none" stroke="#b8902a" stroke-width="0.8"/>

  <!-- Corner ornaments -->
  <polygon points="14,14 32,14 14,32" fill="#1e2b18"/>
  <polygon points="386,14 368,14 386,32" fill="#1e2b18"/>
  <polygon points="14,506 32,506 14,488" fill="#1e2b18"/>
  <polygon points="386,506 368,506 386,488" fill="#1e2b18"/>

  <!-- Header -->
  <text x="200" y="50" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="9" letter-spacing="4" fill="#b8902a">IRELAND · 1901</text>
  <line x1="70" y1="60" x2="330" y2="60" stroke="#b8902a" stroke-width="0.6"/>

  <!-- Celtic diamond ornament -->
  <polygon points="200,72 208,80 200,88 192,80" fill="none" stroke="#b8902a" stroke-width="1"/>
  <polygon points="200,76 204,80 200,84 196,80" fill="#b8902a"/>

  <!-- Map area background -->
  <rect x="60" y="96" width="280" height="300" fill="#e8e0d0" rx="2"/>

  <!-- Ireland silhouette -->
  <g transform="translate(200, 250)">
    <path d="
      M 8,-130 C 30,-132 60,-120 72,-100
      C 80,-85 76,-65 70,-50
      C 86,-38 94,-14 88,12
      C 98,36 94,68 78,84
      C 72,102 62,120 56,138
      C 44,158 26,170 6,170
      C -12,170 -32,160 -44,144
      C -60,126 -64,100 -60,76
      C -78,56 -86,30 -76,4
      C -86,-20 -84,-52 -68,-68
      C -60,-82 -50,-90 -44,-100
      C -40,-115 -34,-128 -18,-138
      C -4,-146 4,-134 8,-130 Z
    " fill="#c8d5c0" stroke="#4a6741" stroke-width="1.5"/>
    <!-- County highlight: Cork (south) -->
    <ellipse cx="8" cy="138" rx="28" ry="20" fill="#4a6741" fill-opacity="0.45"/>
    <circle cx="8" cy="138" r="7" fill="#1e2b18" fill-opacity="0.6"/>
  </g>

  <!-- Bottom divider -->
  <line x1="70" y1="412" x2="330" y2="412" stroke="#b8902a" stroke-width="0.6"/>
  <polygon points="200,406 204,412 200,418 196,412" fill="#b8902a"/>

  <!-- THE label -->
  <text x="200" y="435" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="8" letter-spacing="3" fill="#6b5f4a">THE</text>

  <!-- Family name -->
  <text x="200" y="463" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-style="italic" fill="#1e2b18">Murphy</text>

  <!-- Location -->
  <text x="200" y="484" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="9" letter-spacing="3" fill="#b8902a">FAMILY · CO. CORK</text>

  <!-- Footer -->
  <text x="200" y="500" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="7.5" letter-spacing="2" fill="#9a9080">IRISH ANCESTRY ART</text>
</svg>
